<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#287dff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Geometry Dash Web</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' fill='%237dff00' stroke='%23000' stroke-width='3'/%3E%3Crect x='9' y='9' width='14' height='14' fill='%2300ffff' stroke='%23000' stroke-width='2'/%3E%3C/svg%3E" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="cv"></canvas>

  <div id="ui">
    <!-- ============================================================ LOADING -->
    <section id="s-loading" class="screen">
      <div class="logo">GEOMETRY DASH</div>
      <div class="sublogo">WEB EDITION</div>
      <div class="loadbar"><div id="loadfill"></div></div>
      <div id="tapstart" class="tap hidden">Click / Tap to start</div>
      <div class="tip" id="tip"></div>
    </section>

    <!-- ============================================================ MAIN MENU -->
    <section id="s-menu" class="screen hidden">
      <div class="logo menu-logo">GEOMETRY DASH</div>
      <div class="menu-row">
        <button class="mbtn side" id="b-icons" title="Icon Kit"><canvas id="c-iconbtn" width="140" height="140"></canvas></button>
        <button class="mbtn play" id="b-play" title="Play">
          <svg viewBox="0 0 100 100"><polygon points="36,24 78,50 36,76" fill="#fff" stroke="#000" stroke-width="6" stroke-linejoin="round"/></svg>
        </button>
        <button class="mbtn side" id="b-create" title="Create">
          <svg viewBox="0 0 100 100">
            <rect x="20" y="56" width="26" height="26" fill="#111" stroke="#fff" stroke-width="4"/>
            <rect x="50" y="56" width="26" height="26" fill="#111" stroke="#fff" stroke-width="4"/>
            <polygon points="50,52 63,26 76,52" fill="#111" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
            <g transform="rotate(-40 38 30)"><rect x="30" y="14" width="22" height="12" rx="2" fill="#ffd23f" stroke="#000" stroke-width="3"/><rect x="38" y="25" width="6" height="26" fill="#a0602a" stroke="#000" stroke-width="3"/></g>
          </svg>
        </button>
      </div>
      <div class="menu-labels"><span>Icon Kit</span><span></span><span>Create</span></div>
      <div class="corner bl">
        <button class="rbtn" id="b-settings" title="Settings"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.2h-4l-.4 2.7c-.6.3-1.2.6-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.7h4l.4-2.7c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button>
        <button class="rbtn" id="b-stats" title="Stats"><svg viewBox="0 0 24 24"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="6" width="4" height="15"/><rect x="17" y="9" width="4" height="12"/></svg></button>
      </div>
      <div class="corner br">
        <button class="rbtn" id="b-help" title="How to play"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 16h-2v-2h2zm2.1-7.7-.9.9c-.7.7-1.2 1.3-1.2 2.8h-2v-.5c0-1.1.5-2.1 1.2-2.8l1.2-1.3A2 2 0 1 0 10 8H8a4 4 0 1 1 7.1 2.3z"/></svg></button>
        <button class="rbtn" id="b-full" title="Fullscreen"><svg viewBox="0 0 24 24"><path d="M3 3h7v2H5v5H3zm11 0h7v7h-2V5h-5zM3 14h2v5h5v2H3zm16 0h2v7h-7v-2h5z"/></svg></button>
      </div>
      <div class="corner tr stars-pill" id="menu-stars"></div>
    </section>

    <!-- ============================================================ LEVEL SELECT -->
    <section id="s-levels" class="screen hidden">
      <button class="back" data-back="menu" title="Back"></button>
      <div class="lv-wrap">
        <button class="arrow left" id="lv-prev" title="Previous"></button>
        <div id="lv-card" class="lv-card"></div>
        <button class="arrow right" id="lv-next" title="Next"></button>
      </div>
      <div class="lv-bars" id="lv-bars"></div>
      <div class="dots" id="lv-dots"></div>
    </section>

    <!-- ============================================================ ICON KIT -->
    <section id="s-icons" class="screen hidden">
      <button class="back" data-back="menu" title="Back"></button>
      <div class="kit">
        <div class="kit-top">
          <canvas id="kit-preview" width="520" height="110"></canvas>
        </div>
        <div class="kit-tabs" id="kit-tabs"></div>
        <div class="kit-body">
          <div class="panel kit-grid" id="kit-grid"></div>
          <div class="panel kit-colors">
            <div class="kit-label">Primary</div>
            <div class="swatches" id="kit-c1"></div>
            <div class="kit-label">Secondary</div>
            <div class="swatches" id="kit-c2"></div>
            <label class="check"><input type="checkbox" id="kit-glow" /><span></span>Glow</label>
          </div>
        </div>
      </div>
    </section>

    <!-- ============================================================ CREATOR -->
    <section id="s-creator" class="screen hidden">
      <button class="back" data-back="menu" title="Back"></button>
      <div class="title-gold">My Levels</div>
      <div class="creator-bar">
        <button class="gbtn" id="cr-new">+ New Level</button>
        <button class="gbtn blue" id="cr-import">Import Code</button>
      </div>
      <div class="panel creator-list" id="cr-list"></div>
    </section>

    <!-- ============================================================ EDITOR -->
    <section id="s-editor" class="screen hidden"></section>

    <!-- ============================================================ GAME HUD -->
    <div id="hud" class="hidden">
      <button class="hud-btn" id="h-pause" title="Pause (Esc)"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
      <div id="h-practice" class="hidden">
        <button class="hud-cp" id="h-cp" title="Place checkpoint (Z)"><svg viewBox="0 0 24 24"><polygon points="12,2 20,12 12,22 4,12" fill="#5dff5d" stroke="#063" stroke-width="2"/></svg></button>
        <button class="hud-cp" id="h-uncp" title="Remove checkpoint (X)"><svg viewBox="0 0 24 24"><polygon points="12,2 20,12 12,22 4,12" fill="#5dff5d" stroke="#063" stroke-width="2"/><path d="M6 6 18 18M18 6 6 18" stroke="#e00" stroke-width="3"/></svg></button>
      </div>
    </div>

    <!-- ============================================================ PAUSE -->
    <div id="o-pause" class="overlay hidden">
      <div class="panel dark pause-panel">
        <div class="pause-title" id="p-title">Level</div>
        <div class="pbars" id="p-bars"></div>
        <div class="pause-row">
          <button class="cbtn green" id="p-practice" title="Practice Mode"><svg viewBox="0 0 24 24"><polygon points="12,2 20,12 12,22 4,12" fill="#5dff5d" stroke="#063" stroke-width="2"/></svg></button>
          <button class="cbtn green big" id="p-resume" title="Resume"><svg viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19" fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg></button>
          <button class="cbtn green" id="p-restart" title="Restart (R)"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z" fill="#fff" stroke="#000" stroke-width="1"/></svg></button>
          <button class="cbtn green" id="p-exit" title="Menu"><svg viewBox="0 0 24 24"><rect x="5" y="6" width="14" height="2.6" rx="1" fill="#fff" stroke="#000" stroke-width="0.8"/><rect x="5" y="11" width="14" height="2.6" rx="1" fill="#fff" stroke="#000" stroke-width="0.8"/><rect x="5" y="16" width="14" height="2.6" rx="1" fill="#fff" stroke="#000" stroke-width="0.8"/></svg></button>
        </div>
        <div class="sliders">
          <label>Music <input type="range" min="0" max="100" id="p-music" /></label>
          <label>SFX <input type="range" min="0" max="100" id="p-sfx" /></label>
        </div>
        <div class="pause-opts">
          <label class="check"><input type="checkbox" data-set="showPct" /><span></span>Show %</label>
          <label class="check"><input type="checkbox" data-set="showBar" /><span></span>Progress Bar</label>
          <label class="check"><input type="checkbox" data-set="autoCP" /><span></span>Auto Checkpoints</label>
          <label class="check"><input type="checkbox" data-set="hitboxes" /><span></span>Hitboxes (Practice)</label>
        </div>
      </div>
    </div>

    <!-- ============================================================ COMPLETE -->
    <div id="o-complete" class="overlay hidden">
      <div class="panel complete-panel">
        <div class="title-gold" id="c-title">LEVEL COMPLETE!</div>
        <div class="c-stats" id="c-stats"></div>
        <div class="c-reward" id="c-reward"></div>
        <div class="pause-row">
          <button class="cbtn green big" id="c-replay" title="Replay"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z" fill="#fff" stroke="#000" stroke-width="1"/></svg></button>
          <button class="cbtn green big" id="c-menu" title="Menu"><svg viewBox="0 0 24 24"><rect x="5" y="6" width="14" height="2.6" rx="1" fill="#fff" stroke="#000" stroke-width="0.8"/><rect x="5" y="11" width="14" height="2.6" rx="1" fill="#fff" stroke="#000" stroke-width="0.8"/><rect x="5" y="16" width="14" height="2.6" rx="1" fill="#fff" stroke="#000" stroke-width="0.8"/></svg></button>
        </div>
      </div>
    </div>

    <!-- ============================================================ GENERIC DIALOG -->
    <div id="o-dialog" class="overlay hidden">
      <div class="panel dialog">
        <div class="dlg-title" id="d-title"></div>
        <div class="dlg-body" id="d-body"></div>
        <div class="dlg-btns" id="d-btns"></div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
    <div id="rotate-hint" class="rotate-hint">Rotate your device for the best experience</div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/objects.js"></script>
  <script src="js/levelfmt.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/levels/clockwork.js"></script>
  <script src="js/levels/nightmare.js"></script>
  <script src="js/levels/overload.js"></script>
  <script src="js/levels/horizon.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/render.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
